name: frontend-ci

# Clean-checkout validation for the browser client. No secret, no backend and no container are
# required, so a pull request from a fork validates exactly like a maintainer branch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the whitespace gate below can diff against a real base commit.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Whitespace safety
        # Scoped to what this run introduces: the pull-request base for a PR, the previous commit
        # for a push. Pre-existing whitespace elsewhere in the tree is not this gate's business, so
        # a clean checkout always starts green.
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ] && git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          if [ -z "$base" ]; then
            echo 'No base commit to compare against; nothing introduced by this run.'
            exit 0
          fi
          git diff --check "$base" HEAD

      - name: Install dependencies
        # pnpm-lock.yaml is the committed lock file, so the frozen install is reproducible from a
        # clean checkout. The local Docker image still uses npm; only the lock file is authoritative.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        # Bounded worker pool: CI runners are small, and an unbounded pool makes jsdom suites flaky.
        run: pnpm exec vitest run --poolOptions.forks.minForks=1 --poolOptions.forks.maxForks=2

      - name: Production build
        env:
          # Bounded build identity: the revision only, injected at build time.
          VITE_APP_REVISION: ${{ github.sha }}
        run: pnpm run build
